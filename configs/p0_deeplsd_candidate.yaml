config_version: p0-deeplsd-candidate-2026-08-10.2

ingest:
  max_file_bytes: 52428800
  max_pixels: 40000000
  min_side_px: 64
  allow_filename_format_mismatch: true

analysis:
  max_long_side: 1280

line_backend:
  name: deeplsd
  allow_fallback: false
  deeplsd_weights: weights/deeplsd/deeplsd_md.safetensors
  deeplsd_max_side: 512
  deeplsd_threads: 2
  deeplsd_timeout_seconds: 45
  opencv_refine: std
  min_length_px: 24.0
  min_quality: 0.0
  max_lines: 750
  suppress_curve_fragments: true
  curve_max_segment_length_px: 96.0
  curve_neighbor_gap_px: 24.0
  curve_neighbor_angle_deg: 28.0
  curve_min_component_lines: 5
  curve_min_direction_span_deg: 30.0
  curve_min_contiguous_direction_bins: 4

applicability:
  target_line_count: 40
  target_total_length: 12.0
  target_spatial_coverage: 0.25
  min_line_count: 8
  min_total_length: 1.5
  min_spatial_coverage: 0.04
  grid_size: 8
  direction_bins: 18
  special_imaging_cap: 0.20
  anomaly_min_applicability: 0.45

vanishing_points:
  max_families: 4
  max_hypotheses: 500
  pair_min_angle_deg: 5.0
  inlier_angle_deg: 2.5
  min_family_lines: 4
  min_family_weight: 80.0
  bootstrap_rounds: 8
  bootstrap_fraction: 0.8
  family_jaccard_merge: 0.70
  max_parallel_families: 6
  parallel_inlier_angle_deg: 2.5
  competing_family_max_extent_ratio: 0.60
  compact_component_min_lines: 2
  compact_component_max_extent_ratio: 0.18
  compact_component_link_distance_ratio: 0.10
  compact_component_max_link_distance_px: 12.0
  compact_component_min_line_length_ratio: 0.06
  compact_component_max_family_inlier_ratio: 0.18
  compact_component_max_family_weight_ratio: 0.65
  compact_component_nearby_distance_ratio: 0.10
  compact_component_max_nearby_distance_px: 20.0
  unassigned_candidate_min_length_ratio: 0.08
  local_family_grid_size: 3
  local_families_per_cell: 2
  max_local_families: 8
  local_min_family_weight: 40.0
  local_direction_families_per_cell: 5
  local_direction_inlier_angle_deg: 5.0

overlays:
  line_width: 2
  draw_line_ids: false
