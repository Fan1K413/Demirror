[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-trust"
version = "0.1.0"
description = "P0 projection-geometry measurement baseline for image provenance analysis."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "Demirror contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.8,<5",
  "Pillow>=10,<13",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]
p2 = [
  "scikit-learn>=1.7,<2",
]
watermark = [
  "PyWavelets==1.8.0",
  "onnxruntime==1.23.2",
  "bchlib==2.1.3",
]
watermark-audit = [
  "invisible-watermark==0.2.0",
]

[project.scripts]
image-trust = "image_trust.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"image_trust.geometry_ai" = ["review_static/*.html", "review_static/*.css", "review_static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
