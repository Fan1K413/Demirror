name: Docker image

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/docker-image.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "pyproject.toml"
      - "requirements*.lock"
      - "src/**"
      - "models/**"
      - "configs/**"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/docker-image.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "pyproject.toml"
      - "requirements*.lock"
      - "src/**"
      - "models/**"
      - "configs/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build-test:
    needs: prepare
    name: Build and test (${{ matrix.arch }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            port: 18765
          - arch: arm64
            platform: linux/arm64
            port: 18766

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up ARM64 emulation
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.arch }} smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          tags: demirror:ci-${{ matrix.arch }}
          build-args: |
            INSTALL_OPTIONAL_DETECTORS=1
          cache-from: type=gha,scope=demirror-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=demirror-${{ matrix.arch }}
          provenance: false
          sbom: false

      - name: Smoke test ${{ matrix.arch }} health endpoint
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(
            docker run --detach --rm \
              --platform '${{ matrix.platform }}' \
              --publish '127.0.0.1:${{ matrix.port }}:8765' \
              'demirror:ci-${{ matrix.arch }}' \
              serve \
              --host 0.0.0.0 \
              --port 8765 \
              --jobs-root /app/.demirror_web_jobs \
              --allow-non-loopback \
              --skip-model-bootstrap
          )"
          trap 'docker stop "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent 'http://127.0.0.1:${{ matrix.port }}/api/health' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$container_id"
          exit 1

  publish:
    needs:
      - prepare
      - build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.prepare.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=manual,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            INSTALL_OPTIONAL_DETECTORS=1
          cache-from: |
            type=gha,scope=demirror-amd64
            type=gha,scope=demirror-arm64
          provenance: mode=max
          sbom: true
